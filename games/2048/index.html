<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>2048 — Chenzi Game Library</title>


<style>

:root{

    --bg:#080d18;
    --panel:#0f1728;
    --panel2:#141e31;
    --line:#26334a;

    --text:#e8edf5;
    --muted:#8d9ab0;

    --accent:#6ba8ff;
    --accent2:#8cc8ff;

    --board:#111a2b;
    --empty:#182337;

}


*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    width:100%;

    min-height:100%;

}


body{

    min-height:100vh;

    background:

    radial-gradient(
        circle at 50% -15%,
        #18345f 0%,
        #0a1932 28%,
        #050d1c 65%,
        #020611 100%
    );

    color:var(--text);

    font-family:
        Inter,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    display:flex;

    justify-content:center;

    overflow-x:hidden;

}


/* =========================================================
                         页面
========================================================= */

.page{

    width:min(500px,94vw);

    padding:
        28px
        0
        40px;

}


/* =========================================================
                         顶部
========================================================= */

.topbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:24px;

}


.back{

    color:var(--muted);

    text-decoration:none;

    font-size:13px;

    transition:.15s;

}


.back:hover{

    color:var(--text);

}


.brand{

    color:var(--muted);

    font-size:11px;

    letter-spacing:2px;

}


/* =========================================================
                         标题
========================================================= */

.header{

    text-align:center;

    margin-bottom:20px;

}


h1{

    margin:0;

    font-size:42px;

    line-height:1;

    letter-spacing:2px;

    font-weight:700;

}


.subtitle{

    margin-top:8px;

    color:var(--muted);

    font-size:13px;

    letter-spacing:3px;

}


/* =========================================================
                         信息栏
========================================================= */

.info{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:14px;

    gap:10px;

}


.score-box{

    min-width:110px;

    padding:
        8px
        14px;

    background:
        rgba(15,23,40,.9);

    border:
        1px solid var(--line);

    border-radius:9px;

    text-align:center;

}


.score-label{

    display:block;

    color:var(--muted);

    font-size:10px;

    letter-spacing:1.5px;

}


#score{

    display:block;

    margin-top:2px;

    font-size:20px;

    font-weight:700;

    color:var(--accent2);

}


/* =========================================================
                         模式选择
========================================================= */

.mode-box{

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        8px
        10px;

    background:
        rgba(15,23,40,.9);

    border:
        1px solid var(--line);

    border-radius:9px;

}


.mode-label{

    color:var(--muted);

    font-size:10px;

    letter-spacing:1px;

}


#modeSelect{

    border:0;

    outline:none;

    background:#14243d;

    color:#cfe4ff;

    padding:
        6px
        8px;

    border-radius:6px;

    font-family:inherit;

    font-size:11px;

    cursor:pointer;

}


#modeSelect option{

    background:#14243d;

    color:#d8e9ff;

}


.new-game{

    border:
        1px solid #38547c;

    background:
        #14243d;

    color:#cfe4ff;

    padding:
        10px
        15px;

    border-radius:8px;

    font:inherit;

    font-size:12px;

    cursor:pointer;

    transition:.15s;

}


.new-game:hover{

    background:#1a2f4f;

    border-color:#5278aa;

}


/* =========================================================
                         游戏区域
========================================================= */

.game-wrapper{

    position:relative;

    width:100%;

    aspect-ratio:1 / 1;

    background:
        rgba(15,23,40,.94);

    border:
        1px solid var(--line);

    border-radius:16px;

    padding:14px;

    box-shadow:
        0 18px 60px rgba(0,0,0,.3);

}


canvas{

    display:block;

    width:100%;

    height:100%;

    border-radius:10px;

    touch-action:none;

}


/* =========================================================
                         Overlay
========================================================= */

.overlay{

    position:absolute;

    inset:14px;

    border-radius:10px;

    background:
        rgba(7,12,22,.84);

    /*
     * 已取消 backdrop-filter:
     * 不再对棋盘和背景进行雾化。
     *
     * 保留半透明遮罩，因此弹窗依然
     * 能够突出显示，但底下的棋盘、
     * 分数和背景保持清晰。
     */

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    opacity:0;

    pointer-events:none;

    transition:.25s;

}


.overlay.show{

    opacity:1;

    pointer-events:auto;

}


.overlay-title{

    font-size:30px;

    font-weight:700;

    letter-spacing:2px;

    margin-bottom:8px;

}


.overlay-sub{

    color:var(--muted);

    font-size:13px;

    margin-bottom:20px;

}


.overlay button{

    border:
        1px solid #38547c;

    background:#14243d;

    color:#d8e9ff;

    padding:
        10px
        20px;

    border-radius:8px;

    cursor:pointer;

    font:inherit;

}


/* =========================================================
                         向导
========================================================= */

.wizard-panel{

    display:none;

    margin-top:12px;

    padding:
        11px
        14px;

    border:
        1px solid #30496c;

    border-radius:9px;

    background:
        rgba(15,27,47,.92);

    text-align:center;

}


.wizard-panel.show{

    display:block;

}


.wizard-label{

    color:var(--muted);

    font-size:9px;

    letter-spacing:1.8px;

    margin-bottom:3px;

}


#wizardDirection{

    color:var(--accent2);

    font-size:18px;

    font-weight:700;

    letter-spacing:1px;

}


#wizardReason{

    margin-top:3px;

    color:#7789a5;

    font-size:10px;

}


/* =========================================================
                         手机方向键
========================================================= */

.controls{

    margin-top:16px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    max-width:230px;

    margin-left:auto;

    margin-right:auto;

}


.control{

    height:44px;

    border:
        1px solid var(--line);

    background:
        var(--panel2);

    color:var(--text);

    border-radius:8px;

    cursor:pointer;

    font-size:18px;

    user-select:none;

    -webkit-user-select:none;

    transition:.1s;

}


.control:hover{

    background:#1c2940;

    border-color:#41516b;

}


.control:active{

    transform:scale(.94);

    background:#243650;

}


.control.up{

    grid-column:2;

}


.control.left{

    grid-column:1;

    grid-row:2;

}


.control.down{

    grid-column:2;

    grid-row:2;

}


.control.right{

    grid-column:3;

    grid-row:2;

}


/* =========================================================
                         提示
========================================================= */

.hint{

    text-align:center;

    color:var(--muted);

    font-size:12px;

    line-height:1.6;

    margin-top:15px;

}


.hint b{

    color:#b7c7df;

    font-weight:500;

}


/* =========================================================
                         小屏幕
========================================================= */

@media(max-width:500px){

    .page{

        padding-top:18px;

    }


    h1{

        font-size:36px;

    }


    .score-box{

        min-width:90px;

    }


    .mode-box{

        padding:
            7px
            8px;

    }


    .mode-label{

        display:none;

    }


    #modeSelect{

        font-size:10px;

    }

}

</style>

</head>


<body>


<div class="page">


<div class="topbar">

    <a
        href="../../index.html"
        class="back">

    <div class="brand">

        CHENZI

    </div>

</div>


<header class="header">

    <h1>2048</h1>

    <div class="subtitle">

        PUZZLE GAME

    </div>

</header>


<div class="info">


    <div class="score-box">

        <span class="score-label">

            SCORE

        </span>

        <span id="score">

            0

        </span>

    </div>


    <div class="mode-box">

        <span class="mode-label">

            MODE

        </span>


        <select id="modeSelect">

            <option value="normal">

            </option>

            </option>

        class="new-game"

<div class="game-wrapper">


    <canvas id="gameCanvas"></canvas>


    <div

        id="overlay">


        <div
            class="overlay-title"

            class="overlay-sub"

</div>


<div
    class="wizard-panel"
    id="wizardPanel">


    <div class="wizard-label">

        WIZARD RECOMMENDATION

    </div>

        THINKING...

    </div>

        Deep Expectimax strategy

    </div>


</div>


<div class="controls">

        class="control up"

</div>


<div class="hint">

<script>

/* =========================================================
                         基本参数
========================================================= */

const SIZE = 4;


/* =========================================================
                         Canvas
========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );


const ctx =
    canvas.getContext("2d");


/* =========================================================
                         游戏状态
========================================================= */

let board = null;

let score = 0;

let gameOver = false;

let won = false;

let keepPlaying = false;

let audioContext = null;


/* =========================================================
                         模式
========================================================= */

let currentMode = "normal";

let wizardMode = false;

let autoMode = false;

let autoTimer = null;

let wizardThinking = false;


/* =========================================================
                     自动运行速度
========================================================= */

const AUTO_INTERVAL = 180;


/* =========================================================
                         AI参数
========================================================= */

const AI_TIME_LIMIT = 350;

const AI_TIMEOUT = {};

let aiDeadline = 0;

let aiCache = new Map();

let aiEvalCache = new Map();


/* =========================================================
                    目标角落：右下角
========================================================= */

const TARGET_ROW = 3;

const TARGET_COL = 3;


/* =========================================================
                         蛇形权重
========================================================= */

const SNAKE_WEIGHTS = [

    [ 3,  2,  1,  0],

    [ 4,  5,  6,  7],

    [11, 10,  9,  8],

    [12, 13, 14, 15]

];


/* =========================================================
                         音效
========================================================= */

function playMergeSound(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "triangle";


        oscillator.frequency.setValueAtTime(
            520,
            now
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            0.55,
            now + 0.004
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.065
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start(now);

        oscillator.stop(
            now + 0.07
        );


    }catch(error){

        console.log(
            "Audio unavailable."
        );

    }

}


/* =========================================================
                         Canvas
========================================================= */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;


    canvas.height =
        rect.height * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    draw();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
                         创建棋盘
========================================================= */

function createBoard(){

    return Array.from(
        {length:SIZE},
        () =>
            Array(SIZE).fill(0)
    );

}


/* =========================================================
                         添加方块
========================================================= */

function addTile(){

    const empty = [];


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                board[r][c] === 0
            ){

                empty.push({
                    r,
                    c
                });

            }

        }

    }


    if(
        empty.length === 0
    ){

        return;

    }


    const cell =
        empty[
            Math.floor(
                Math.random() *
                empty.length
            )
        ];


    board[cell.r][cell.c] =
        Math.random() < 0.9
        ? 2
        : 4;

}


/* =========================================================
                         新游戏
========================================================= */

function newGame(){

    stopAutoRun();


    board =
        createBoard();


    score = 0;

    gameOver = false;

    won = false;

    keepPlaying = false;


    hideOverlay();


    addTile();

    addTile();


    updateScore();

    draw();


    if(
        wizardMode
    ){

        updateWizard();

    }

}


/* =========================================================
                         真实合并
========================================================= */

function mergeRow(row){

    const values =
        row.filter(
            value => value !== 0
        );


    const result = [];


    for(
        let i=0;
        i<values.length;
        i++
    ){

        if(
            i < values.length - 1 &&
            values[i] === values[i+1]
        ){

            const value =
                values[i] * 2;


            result.push(value);


            score += value;


            playMergeSound();


            i++;

        }else{

            result.push(
                values[i]
            );

        }

    }


    while(
        result.length < SIZE
    ){

        result.push(0);

    }


    return result;

}


/* =========================================================
                       AI纯合并
========================================================= */

function mergeRowPure(row){

    const values =
        row.filter(
            value => value !== 0
        );


    const result = [];


    for(
        let i=0;
        i<values.length;
        i++
    ){

        if(
            i < values.length - 1 &&
            values[i] === values[i+1]
        ){

            result.push(
                values[i] * 2
            );

            i++;

        }else{

            result.push(
                values[i]
            );

        }

    }


    while(
        result.length < SIZE
    ){

        result.push(0);

    }


    return result;

}


/* =========================================================
                     AI模拟移动
========================================================= */

function simulateMove(
    state,
    direction
){

    const result =
        state.map(
            row => [...row]
        );


    if(
        direction === "left"
    ){

        for(
            let r=0;
            r<SIZE;
            r++
        ){

            result[r] =
                mergeRowPure(
                    result[r]
                );

        }

    }


    else if(
        direction === "right"
    ){

        for(
            let r=0;
            r<SIZE;
            r++
        ){

            result[r] =
                mergeRowPure(
                    [...result[r]].reverse()
                ).reverse();

        }

    }


    else if(
        direction === "up"
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            const column = [];


            for(
                let r=0;
                r<SIZE;
                r++
            ){

                column.push(
                    result[r][c]
                );

            }


            const merged =
                mergeRowPure(
                    column
                );


            for(
                let r=0;
                r<SIZE;
                r++
            ){

                result[r][c] =
                    merged[r];

            }

        }

    }


    else if(
        direction === "down"
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            const column = [];


            for(
                let r=0;
                r<SIZE;
                r++
            ){

                column.push(
                    result[r][c]
                );

            }


            const merged =
                mergeRowPure(
                    [...column].reverse()
                ).reverse();


            for(
                let r=0;
                r<SIZE;
                r++
            ){

                result[r][c] =
                    merged[r];

            }

        }

    }


    return result;

}


/* =========================================================
                     棋盘比较
========================================================= */

function boardsEqual(a,b){

    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                a[r][c] !==
                b[r][c]
            ){

                return false;

            }

        }

    }


    return true;

}


/* =========================================================
                     棋盘Key
========================================================= */

function boardKey(state){

    return state
        .map(
            row => row.join(",")
        )
        .join("|");

}


/* =========================================================
                     空格数量
========================================================= */

function countEmpty(state){

    let count = 0;


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                state[r][c] === 0
            ){

                count++;

            }

        }

    }


    return count;

}


/* =========================================================
                     最大方块
========================================================= */

function getMaxTile(state){

    let max = 0;

    let mr = 0;

    let mc = 0;


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                state[r][c] > max
            ){

                max =
                    state[r][c];

                mr = r;

                mc = c;

            }

        }

    }


    return {

        value:max,

        r:mr,

        c:mc

    };

}


/* =========================================================
                     合法移动
========================================================= */

function getValidMoves(state){

    const directions = [

        "left",

        "right",

        "up",

        "down"

    ];


    const result = [];


    for(
        const direction
        of directions
    ){

        const next =
            simulateMove(
                state,
                direction
            );


        if(
            !boardsEqual(
                state,
                next
            )
        ){

            result.push({

                direction,

                state:next

            });

        }

    }


    return result;

}


/* =========================================================
                     蛇形评分
========================================================= */

function snakeScore(state){

    let value = 0;


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                state[r][c] === 0
            ){

                continue;

            }


            value +=

                Math.log2(
                    state[r][c]
                )

                *

                SNAKE_WEIGHTS[r][c];

        }

    }


    return value;

}


/* =========================================================
                    单调性评分
========================================================= */

function monotonicity(state){

    let value = 0;


    /*
     * 横向蛇形单调。
     */

    for(
        let r=0;
        r<SIZE;
        r++
    ){

        const reverse =
            r % 2 === 0;


        for(
            let c=0;
            c<SIZE-1;
            c++
        ){

            const a =
                state[r][c];

            const b =
                state[r][c+1];


            if(
                a === 0 ||
                b === 0
            ){

                continue;

            }


            const la =
                Math.log2(a);


            const lb =
                Math.log2(b);


            const diff =
                reverse
                ? la - lb
                : lb - la;


            if(
                diff >= 0
            ){

                value += diff;

            }else{

                value +=
                    diff * 2.8;

            }

        }

    }


    /*
     * 纵向总体向下。
     */

    for(
        let c=0;
        c<SIZE;
        c++
    ){

        for(
            let r=0;
            r<SIZE-1;
            r++
        ){

            const a =
                state[r][c];

            const b =
                state[r+1][c];


            if(
                a === 0 ||
                b === 0
            ){

                continue;

            }


            const la =
                Math.log2(a);


            const lb =
                Math.log2(b);


            const diff =
                lb - la;


            if(
                diff >= 0
            ){

                value += diff;

            }else{

                value +=
                    diff * 2.2;

            }

        }

    }


    return value;

}


/* =========================================================
                     平滑度
========================================================= */

function smoothness(state){

    let value = 0;


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                state[r][c] === 0
            ){

                continue;

            }


            const current =
                Math.log2(
                    state[r][c]
                );


            if(
                c+1 < SIZE &&
                state[r][c+1] !== 0
            ){

                value -= Math.abs(

                    current -

                    Math.log2(
                        state[r][c+1]
                    )

                );

            }


            if(
                r+1 < SIZE &&
                state[r+1][c] !== 0
            ){

                value -= Math.abs(

                    current -

                    Math.log2(
                        state[r+1][c]
                    )

                );

            }

        }

    }


    return value;

}


/* =========================================================
                     合并潜力
========================================================= */

function mergePotential(state){

    let value = 0;


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            const current =
                state[r][c];


            if(
                current === 0
            ){

                continue;

            }


            if(
                c+1 < SIZE &&
                current ===
                state[r][c+1]
            ){

                value +=
                    1 +
                    Math.log2(current);

            }


            if(
                r+1 < SIZE &&
                current ===
                state[r+1][c]
            ){

                value +=
                    1 +
                    Math.log2(current);

            }

        }

    }


    return value;

}


/* =========================================================
                  最大方块角落保护
========================================================= */

function cornerProtection(state){

    const max =
        getMaxTile(state);


    const log =
        Math.log2(
            Math.max(
                2,
                max.value
            )
        );


    if(
        max.r === TARGET_ROW &&
        max.c === TARGET_COL
    ){

        return (
            3000 +
            log * 420
        );

    }


    const distance =

        Math.abs(
            max.r -
            TARGET_ROW
        )

        +

        Math.abs(
            max.c -
            TARGET_COL
        );


    return -
        distance *
        (180 + log * 30);

}


/* =========================================================
                   底部锁定奖励
========================================================= */

function bottomLockScore(state){

    let value = 0;


    /*
     * 鼓励底行形成：
     *
     * 低 → 高
     *
     * 左       右
     *
     * 16 32 64 128
     */

    for(
        let c=0;
        c<SIZE-1;
        c++
    ){

        const a =
            state[SIZE-1][c];

        const b =
            state[SIZE-1][c+1];


        if(
            a === 0 ||
            b === 0
        ){

            continue;

        }


        const la =
            Math.log2(a);


        const lb =
            Math.log2(b);


        if(
            lb >= la
        ){

            value +=
                (lb-la) * 70;

        }else{

            value -=
                (la-lb) * 150;

        }

    }


    return value;

}


/* =========================================================
                 移动自由度
========================================================= */

function mobilityScore(state){

    return (
        getValidMoves(state).length
    );

}


/* =========================================================
                     AI评价函数
========================================================= */

function evaluateBoard(state){

    const key =
        "E|" +
        boardKey(state);


    if(
        aiEvalCache.has(key)
    ){

        return aiEvalCache.get(key);

    }


    const empty =
        countEmpty(state);


    const max =
        getMaxTile(state);


    const snake =
        snakeScore(state);


    const mono =
        monotonicity(state);


    const smooth =
        smoothness(state);


    const merges =
        mergePotential(state);


    const mobility =
        mobilityScore(state);


    const corner =
        cornerProtection(state);


    const bottom =
        bottomLockScore(state);


    const maxLog =
        Math.log2(
            Math.max(
                2,
                max.value
            )
        );


    let value =

        empty * 850

        +

        Math.pow(
            empty,
            1.5
        ) * 90

        +

        snake * 42

        +

        mono * 190

        +

        smooth * 48

        +

        merges * 310

        +

        mobility * 260

        +

        corner

        +

        bottom

        +

        maxLog * 110;


    if(
        empty <= 4
    ){

        value +=
            mobility * 180;


        value +=
            empty * 350;

    }


    if(
        max.value >= 256 &&
        max.r === TARGET_ROW &&
        max.c === TARGET_COL
    ){

        value +=
            maxLog *
            500;

    }


    aiEvalCache.set(
        key,
        value
    );


    return value;

}


/* =========================================================
                     AI时间检查
========================================================= */

function checkAITime(){

    if(
        performance.now() >
        aiDeadline
    ){

        throw AI_TIMEOUT;

    }

}


/* =========================================================
                   Chance节点
========================================================= */

function expectimaxChance(
    state,
    depth
){

    checkAITime();


    if(
        depth <= 0
    ){

        return evaluateBoard(
            state
        );

    }


    const key =

        "C|" +

        depth +

        "|" +

        boardKey(state);


    if(
        aiCache.has(key)
    ){

        return aiCache.get(key);

    }


    const emptyCells = [];


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                state[r][c] === 0
            ){

                emptyCells.push({
                    r,
                    c
                });

            }

        }

    }


    if(
        emptyCells.length === 0
    ){

        return expectimaxMax(
            state,
            depth-1
        );

    }


    let total = 0;

    let totalSquare = 0;

    let worst = Infinity;


    for(
        const cell
        of emptyCells
    ){

        checkAITime();


        /*
         * 2
         */

        const state2 =
            state.map(
                row => [...row]
            );


        state2[cell.r][cell.c] =
            2;


        const value2 =
            expectimaxMax(
                state2,
                depth-1
            );


        total +=
            0.9 * value2;


        totalSquare +=
            0.9 *
            value2 *
            value2;


        worst =
            Math.min(
                worst,
                value2
            );


        /*
         * 4
         */

        const state4 =
            state.map(
                row => [...row]
            );


        state4[cell.r][cell.c] =
            4;


        const value4 =
            expectimaxMax(
                state4,
                depth-1
            );


        total +=
            0.1 * value4;


        totalSquare +=
            0.1 *
            value4 *
            value4;


        worst =
            Math.min(
                worst,
                value4
            );

    }


    const expected =
        total /
        emptyCells.length;


    const secondMoment =
        totalSquare /
        emptyCells.length;


    const variance =
        Math.max(
            0,
            secondMoment -
            expected * expected
        );


    const standardDeviation =
        Math.sqrt(
            variance
        );


    const riskAdjusted =

        expected

        -

        standardDeviation *
        0.08

        +

        worst *
        0.025;


    aiCache.set(
        key,
        riskAdjusted
    );


    return riskAdjusted;

}


/* =========================================================
                    Max节点
========================================================= */

function expectimaxMax(
    state,
    depth
){

    checkAITime();


    if(
        depth <= 0
    ){

        return evaluateBoard(
            state
        );

    }


    const valid =
        getValidMoves(state);


    if(
        valid.length === 0
    ){

        return -1e12;

    }


    valid.sort(
        (a,b) =>

            evaluateBoard(
                b.state
            )

            -

            evaluateBoard(
                a.state
            )

    );


    let best =
        -Infinity;


    for(
        const item
        of valid
    ){

        checkAITime();


        const value =
            expectimaxChance(
                item.state,
                depth-1
            );


        if(
            value > best
        ){

            best =
                value;

        }

    }


    return best;

}


/* =========================================================
                 自适应搜索深度
========================================================= */

function getAdaptiveDepth(state){

    const empty =
        countEmpty(state);


    if(
        empty >= 12
    ){

        return 3;

    }


    if(
        empty >= 9
    ){

        return 4;

    }


    if(
        empty >= 6
    ){

        return 5;

    }


    if(
        empty >= 4
    ){

        return 6;

    }


    return 7;

}


/* =========================================================
                  搜索根节点
========================================================= */

function searchRoot(
    state,
    depth
){

    checkAITime();


    const valid =
        getValidMoves(state);


    if(
        valid.length === 0
    ){

        return null;

    }


    valid.sort(
        (a,b) =>

            evaluateBoard(
                b.state
            )

            -

            evaluateBoard(
                a.state
            )

    );


    let bestDirection =
        valid[0].direction;


    let bestValue =
        -Infinity;


    for(
        const item
        of valid
    ){

        checkAITime();


        let structuralPenalty = 0;


        const max =
            getMaxTile(state);


        const nextMax =
            getMaxTile(
                item.state
            );


        if(
            max.value >= 256 &&

            max.r === TARGET_ROW &&

            max.c === TARGET_COL &&

            !(
                nextMax.r === TARGET_ROW &&
                nextMax.c === TARGET_COL
            )
        ){

            structuralPenalty =
                Math.log2(
                    max.value
                ) *
                650;

        }


        const value =

            expectimaxChance(
                item.state,
                depth-1
            )

            -

            structuralPenalty;


        if(
            value > bestValue
        ){

            bestValue =
                value;

            bestDirection =
                item.direction;

        }

    }


    return {

        direction:
            bestDirection,

        value:
            bestValue

    };

}


/* =========================================================
                     获取最佳方向
========================================================= */

function getBestDirection(){

    if(
        !board
    ){

        return null;

    }


    const valid =
        getValidMoves(board);


    if(
        valid.length === 0
    ){

        return null;

    }


    aiCache.clear();

    aiEvalCache.clear();


    aiDeadline =
        performance.now()
        +
        AI_TIME_LIMIT;


    const maxDepth =
        getAdaptiveDepth(
            board
        );


    let bestDirection =
        valid[0].direction;


    let completedDepth = 0;


    for(
        let depth=2;
        depth<=maxDepth;
        depth++
    ){

        try{

            const result =
                searchRoot(
                    board,
                    depth
                );


            if(
                result &&
                result.direction
            ){

                bestDirection =
                    result.direction;

                completedDepth =
                    depth;

            }

        }catch(error){

            if(
                error === AI_TIMEOUT
            ){

                break;

            }


            console.error(
                "AI error:",
                error
            );


            break;

        }

    }


    window.lastWizardDepth =
        completedDepth;


    return bestDirection;

}

/* =========================================================
                    实际移动函数
========================================================= */

function moveLeft(){

    let moved = false;


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        const oldRow =
            [...board[r]];


        const newRow =
            mergeRow(
                oldRow
            );


        board[r] =
            newRow;


        if(
            !arraysEqual(
                oldRow,
                newRow
            )
        ){

            moved = true;

        }

    }


    return moved;

}


function moveRight(){

    let moved = false;


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        const oldRow =
            [...board[r]];


        const newRow =

            mergeRow(
                [...oldRow].reverse()
            ).reverse();


        board[r] =
            newRow;


        if(
            !arraysEqual(
                oldRow,
                newRow
            )
        ){

            moved = true;

        }

    }


    return moved;

}


function moveUp(){

    let moved = false;


    for(
        let c=0;
        c<SIZE;
        c++
    ){

        const oldCol = [];


        for(
            let r=0;
            r<SIZE;
            r++
        ){

            oldCol.push(
                board[r][c]
            );

        }


        const newCol =
            mergeRow(
                oldCol
            );


        for(
            let r=0;
            r<SIZE;
            r++
        ){

            board[r][c] =
                newCol[r];

        }


        if(
            !arraysEqual(
                oldCol,
                newCol
            )
        ){

            moved = true;

        }

    }


    return moved;

}


function moveDown(){

    let moved = false;


    for(
        let c=0;
        c<SIZE;
        c++
    ){

        const oldCol = [];


        for(
            let r=0;
            r<SIZE;
            r++
        ){

            oldCol.push(
                board[r][c]
            );

        }


        const newCol =

            mergeRow(
                [...oldCol].reverse()
            ).reverse();


        for(
            let r=0;
            r<SIZE;
            r++
        ){

            board[r][c] =
                newCol[r];

        }


        if(
            !arraysEqual(
                oldCol,
                newCol
            )
        ){

            moved = true;

        }

    }


    return moved;

}


/* =========================================================
                     数组比较
========================================================= */

function arraysEqual(a,b){

    if(
        a.length !==
        b.length
    ){

        return false;

    }


    for(
        let i=0;
        i<a.length;
        i++
    ){

        if(
            a[i] !==
            b[i]
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
                     是否还能移动
========================================================= */

function canMove(){

    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                board[r][c] === 0
            ){

                return true;

            }

        }

    }


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE-1;
            c++
        ){

            if(
                board[r][c] ===
                board[r][c+1]
            ){

                return true;

            }

        }

    }


    for(
        let c=0;
        c<SIZE;
        c++
    ){

        for(
            let r=0;
            r<SIZE-1;
            r++
        ){

            if(
                board[r][c] ===
                board[r+1][c]
            ){

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
                     是否胜利
========================================================= */

function checkWin(){

    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            if(
                board[r][c] >=
                2048
            ){

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
                     执行移动
========================================================= */

function move(direction){

    if(
        gameOver
    ){

        return;

    }


    if(
        won &&
        !keepPlaying
    ){

        return;

    }


    let moved = false;


    switch(direction){

        case "left":

            moved =
                moveLeft();

            break;


        case "right":

            moved =
                moveRight();

            break;


        case "up":

            moved =
                moveUp();

            break;


        case "down":

            moved =
                moveDown();

            break;

    }


    if(
        !moved
    ){

        return;

    }


    addTile();


    updateScore();

    draw();


    /*
     * =====================================================
     * AUTO TEST 的关键修改
     *
     * AUTO模式达到2048以后：
     *
     * 1. 不设置 won
     * 2. 不显示 YOU WIN
     * 3. 不停止 autoTimer
     *
     * 因此AI会继续向 4096 / 8192 / 16384...
     * 无限挑战，直到真正 Game Over。
     * =====================================================
     */

    if(
        !autoMode &&
        !won &&
        checkWin()
    ){

        won = true;

        showWin();

        return;

    }


    /*
     * AUTO模式下即使达到2048，
     * 也不会进入上面的 YOU WIN。
     */


    if(
        !canMove()
    ){

        gameOver = true;

        showGameOver();

        if(
            autoMode
        ){

            stopAutoRun();

        }

        return;

    }


    if(
        wizardMode
    ){

        updateWizard();

    }

}

/* =========================================================
                     圆角矩形
========================================================= */

function roundedRect(
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();


    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );


    ctx.fill();

}


/* =========================================================
                     绘制棋盘
========================================================= */

function draw(){

    if(
        !board
    ){

        return;

    }


    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle =
        "#101a2b";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const gap =
        Math.max(
            7,
            width * 0.025
        );


    const tileSize =

        (
            width -
            gap * 5
        ) / 4;


    for(
        let r=0;
        r<SIZE;
        r++
    ){

        for(
            let c=0;
            c<SIZE;
            c++
        ){

            const x =

                gap +

                c *
                (
                    tileSize +
                    gap
                );


            const y =

                gap +

                r *
                (
                    tileSize +
                    gap
                );


            const value =
                board[r][c];


            const style =
                getTileStyle(
                    value
                );


            ctx.fillStyle =
                style.bg;


            roundedRect(

                x,

                y,

                tileSize,

                tileSize,

                Math.max(
                    6,
                    tileSize * .08
                )

            );


            if(
                value !== 0
            ){

                let fontSize;


                if(
                    value < 100
                ){

                    fontSize =
                        tileSize * .34;

                }

                else if(
                    value < 1000
                ){

                    fontSize =
                        tileSize * .29;

                }

                else{

                    fontSize =
                        tileSize * .22;

                }


                ctx.fillStyle =
                    style.text;


                ctx.font =

                    `700 ${fontSize}px Inter, "Segoe UI", sans-serif`;


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.fillText(

                    value.toString(),

                    x +
                    tileSize / 2,

                    y +
                    tileSize / 2

                );

            }

        }

    }

}

/* =========================================================

========================================================= */

function stopAutoRun(){

        autoTimer !== null
    ){

        clearTimeout(
            autoTimer
        );


        autoTimer = null;

    }

}


/* =========================================================
                     自动下一步
========================================================= */

function autoStep(){

    if(
        !autoMode
    ){

        return;

    }


    if(
        gameOver ||
        !board
    ){

        stopAutoRun();

        return;

    }


    /*
     * AUTO模式现在不会因为达到2048
     * 而设置 won / 停止。
     *
     * 因此这里会一直运行，
     * 直到 gameOver。
     */

    const direction =
        getBestDirection();


    if(
        !direction
    ){

        stopAutoRun();

        return;

    }


    move(direction);


    if(
        autoMode &&
        !gameOver
    ){

        autoTimer =
            setTimeout(
                autoStep,
                AUTO_INTERVAL
            );

    }

}


/* =========================================================
                     开始自动测试
========================================================= */

function startAutoRun(){

    stopAutoRun();


    /*
     * AUTO TEST每次都重新开局。
     */

    board =
        createBoard();


    score = 0;

    gameOver = false;

    won = false;

    keepPlaying = false;


    hideOverlay();


    addTile();

    addTile();


    updateScore();

    draw();


    autoMode = true;


    document
        .getElementById(
            "wizardDirection"
        )
        .textContent =
        "AUTO RUN";


    document
        .getElementById(
            "wizardReason"
        )
        .textContent =
        "AI is playing automatically";


    autoTimer =
        setTimeout(
            autoStep,
            300
        );

}


/* =========================================================
                     Overlay按钮
========================================================= */

document
    .getElementById(
        "overlayButton"
    )
    .addEventListener(

        "click",

        () => {

            if(
                won &&
                !keepPlaying
            ){

                keepPlaying =
                    true;


                hideOverlay();


                if(
                    autoMode
                ){

                    autoStep();

                }

                else if(
                    wizardMode
                ){

                    updateWizard();

                }

            }

            else{

                newGame();

            }

        }

    );


/* =========================================================
                     新游戏按钮
========================================================= */

document
    .getElementById(
        "newGame"
    )
    .addEventListener(

        "click",

        () => {

            if(
                currentMode ===
                "auto"
            ){

                startAutoRun();

            }

            else{

                newGame();

            }

        }

    );


/* =========================================================
                     模式切换
========================================================= */

document
    .getElementById(
        "modeSelect"
    )
    .addEventListener(

        "change",

        event => {

            const mode =
                event.target.value;


            currentMode =
                mode;


            stopAutoRun();


            wizardMode =
                mode === "wizard";


            autoMode =
                false;


            const panel =
                document.getElementById(
                    "wizardPanel"
                );


            /*
             * NORMAL
             */

            if(
                mode === "normal"
            ){

                panel.classList.remove(
                    "show"
                );


                newGame();


                return;

            }


            /*
             * WIZARD
             */

            if(
                mode === "wizard"
            ){

                panel.classList.add(
                    "show"
                );


                newGame();


                return;

            }


            /*
             * AUTO TEST
             */

            if(
                mode === "auto"
            ){

                panel.classList.add(
                    "show"
                );


                startAutoRun();


                return;

            }

        }

    );


/* =========================================================
                     键盘
========================================================= */

document.addEventListener(

    "keydown",

    event => {

        const keys = {

            ArrowLeft:
                "left",

            ArrowRight:
                "right",

            ArrowUp:
                "up",

            ArrowDown:
                "down"

        };


        if(
            keys[event.key]
        ){

            event.preventDefault();


            /*
             * AUTO TEST中忽略玩家输入。
             */

            if(
                autoMode
            ){

                return;

            }


            move(
                keys[event.key]
            );

        }

    }

);


/* =========================================================
                     屏幕方向键
========================================================= */

document
    .querySelectorAll(
        ".control"
    )
    .forEach(

        button => {

            button.addEventListener(

                "click",

                () => {

                    if(
                        autoMode
                    ){

                        return;

                    }


                    move(
                        button.dataset.direction
                    );

                }

            );

        }

    );


/* =========================================================
                     触摸滑动
========================================================= */

let touchStartX = 0;

let touchStartY = 0;


canvas.addEventListener(

    "touchstart",

    event => {

        if(
            autoMode
        ){

            return;

        }


        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },

    {
        passive:true
    }

);


canvas.addEventListener(

    "touchend",

    event => {

        if(
            autoMode
        ){

            return;

        }


        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        const threshold = 25;


        if(

            Math.abs(dx) <
            threshold &&

            Math.abs(dy) <
            threshold

        ){

            return;

        }


        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            move(
                dx > 0
                ? "right"
                : "left"
            );

        }

        else{

            move(
                dy > 0
                ? "down"
                : "up"
            );

        }

    },

    {
        passive:true
    }

);


/* =========================================================
                     初始化
========================================================= */

newGame();

resizeCanvas();

</script>
