<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tetris · Chenzi Game Library</title>

<style>

/* =========================================================
                         基础
========================================================= */

:root{
    --bg:#070b14;
    --panel:#0e1420;
    --panel2:#151c2a;
    --line:#263247;
    --text:#e8edf5;
    --muted:#7f8ba0;
    --accent:#66d9a8;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 50% -15%,
        #18345f 0%,
        #0a1932 28%,
        #050d1c 65%,
        #020611 100%
    );


    color:var(--text);

    font-family:
        Inter,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    display:flex;
    justify-content:center;

    overflow-x:hidden;
}


/* =========================================================
                         星空
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background-image:

        radial-gradient(
            1px 1px at 10% 20%,
            rgba(255,255,255,.65),
            transparent
        ),

        radial-gradient(
            1px 1px at 27% 72%,
            rgba(255,255,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 46% 18%,
            rgba(255,255,255,.55),
            transparent
        ),

        radial-gradient(
            1px 1px at 68% 34%,
            rgba(255,255,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 83% 76%,
            rgba(255,255,255,.55),
            transparent
        ),

        radial-gradient(
            1px 1px at 92% 17%,
            rgba(255,255,255,.4),
            transparent
        );

    opacity:.7;
}


/* =========================================================
                         主容器
========================================================= */

.app{

    width:min(720px,94vw);

    /*
     * 根据屏幕高度自动控制上下空间
     * 避免桌面端打开后出现滚动
     */
    padding:
        clamp(10px,2.5vh,18px)
        0
        12px;

    position:relative;

    z-index:1;
}


/* =========================================================
                         顶部
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;
}

.back{

    color:var(--muted);

    text-decoration:none;

    font-size:13px;

    transition:.15s;
}

.back:hover{

    color:var(--text);

    transform:translateX(-2px);
}

.brand{

    color:var(--muted);

    font-size:12px;

    letter-spacing:2px;
}


/* =========================================================
                         标题
========================================================= */

.header{

    text-align:center;

    margin-bottom:18px;
}

h1{

    margin:0;

    font-size:32px;

    letter-spacing:5px;

    font-weight:700;
}

.subtitle{

    margin-top:6px;

    color:var(--muted);

    font-size:12px;

    letter-spacing:3px;
}


/* =========================================================
                         游戏区域
========================================================= */

.game-panel{

    background:
        rgba(14,20,32,.92);

    border:
        1px solid var(--line);

    border-radius:16px;

    /*
     * 高度较小时自动压缩内边距
     */
    padding:
        clamp(10px,1.8vh,18px);

    box-shadow:
        0 20px 70px rgba(0,0,0,.35);

    backdrop-filter:
        blur(8px);
}


/* =========================================================
                         状态栏
========================================================= */

.status{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:14px;

    padding:
        10px
        13px;

    background:#0a101a;

    border:
        1px solid #202b3e;

    border-radius:9px;

    font-size:13px;
}

.status-label{

    color:var(--muted);
}

.score{

    color:var(--accent);

    font-size:17px;

    font-weight:700;
}


/* =========================================================
                         棋盘
========================================================= */

.board-wrap{

    display:flex;

    justify-content:center;

    width:100%;

    padding:4px;
}

#gameCanvas{

    /*
     * 正常桌面：
     * 最大 300 × 600
     *
     * 高度不足时：
     * 根据视口高度自动缩小
     *
     * 宽度不足时：
     * 根据视口宽度自动缩小
     */
    width:min(
        300px,
        38vh,
        80vw
    );

    height:auto;

    aspect-ratio:1 / 2;

    display:block;

    background:#080d16;

    border:
        1px solid #27344a;

    border-radius:7px;

    box-shadow:
        0 0 35px rgba(0,0,0,.45);

    image-rendering:pixelated;
}


/* =========================================================
                         操作提示
========================================================= */

.controls{

    margin-top:16px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:7px;
}

.control{

    text-align:center;

    padding:8px 4px;

    background:#111927;

    border:
        1px solid #202b3e;

    border-radius:7px;

    color:var(--muted);

    font-size:11px;
}

.control b{

    display:block;

    color:var(--text);

    margin-bottom:3px;

    font-size:12px;
}


/* =========================================================
                         底部
========================================================= */

.footer{

    text-align:center;

    margin-top:12px;

    color:#566276;

    font-size:11px;

    line-height:1.6;
}


/* =========================================================
                         游戏结束遮罩
========================================================= */

.overlay{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        rgba(3,6,12,.72);

    backdrop-filter:
        blur(5px);

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:10;
}

.overlay.show{

    opacity:1;

    pointer-events:auto;
}

.gameover-box{

    width:min(340px,86vw);

    padding:28px;

    text-align:center;

    background:#101827;

    border:
        1px solid #2b3850;

    border-radius:15px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.5);
}

.gameover-title{

    font-size:26px;

    font-weight:700;

    letter-spacing:2px;

    margin-bottom:8px;
}

.gameover-score{

    color:var(--muted);

    margin-bottom:22px;
}

.restart{

    border:1px solid #315a4b;

    background:#17352d;

    color:#b9f3db;

    padding:
        10px
        24px;

    border-radius:8px;

    cursor:pointer;

    font:inherit;
}

.restart:hover{

    background:#1c4539;
}


/* =========================================================
                         暂停
========================================================= */

.pause{

    color:#8bb8ff;

}


/* =========================================================
                         手机
========================================================= */

@media(max-width:520px){

    .app{

        width:94vw;

        padding:
            12px
            0
            16px;
    }


    .topbar{

        margin-bottom:12px;
    }


    .header{

        margin-bottom:12px;
    }


    h1{

        font-size:27px;

        letter-spacing:4px;
    }


    .subtitle{

        font-size:10px;

        letter-spacing:2px;
    }


    .game-panel{

        padding:10px;

        border-radius:12px;
    }


    .status{

        margin-bottom:10px;

        padding:
            8px
            11px;
    }


    .board-wrap{

        padding:2px;
    }


    #gameCanvas{

        /*
         * 手机端优先保证棋盘足够大
         */
        width:min(
            300px,
            78vw
        );

        height:auto;

        aspect-ratio:1 / 2;
    }


    .controls{

        margin-top:10px;

        grid-template-columns:
            repeat(3,1fr);

        gap:6px;
    }


    .control{

        padding:7px 3px;

        font-size:10px;
    }


    .control b{

        font-size:11px;

        margin-bottom:2px;
    }


    .footer{

        margin-top:10px;

        font-size:10px;
    }

}


/* =========================================================
                  桌面端矮窗口适配
========================================================= */

@media(
    min-width:521px
) and (max-height:800px){

    .app{

        padding-top:8px;

        padding-bottom:8px;
    }


    .topbar{

        margin-bottom:10px;
    }


    .header{

        margin-bottom:10px;
    }


    h1{

        font-size:28px;
    }


    .subtitle{

        margin-top:4px;

        font-size:10px;
    }


    .game-panel{

        padding:10px;
    }


    .status{

        margin-bottom:8px;

        padding:
            7px
            10px;
    }


    #gameCanvas{

        width:min(
            260px,
            34vh
        );
    }


    .controls{

        margin-top:8px;
    }


    .control{

        padding:6px 3px;

        font-size:10px;
    }


    .control b{

        font-size:11px;

        margin-bottom:2px;
    }


    .footer{

        margin-top:8px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
                         顶部
===================================================== -->

<div class="topbar">

    <a
        href="../../index.html"
        class="back">

        ← Game Library

    </a>

    <div class="brand">
        CHENZI
    </div>

</div>


<!-- =====================================================
                         标题
===================================================== -->

<header class="header">

    <h1>TETRIS</h1>

    <div class="subtitle">
        CLASSIC BLOCK PUZZLE
    </div>

</header>


<!-- =====================================================
                         游戏
===================================================== -->

<div class="game-panel">


    <!-- 状态 -->

    <div class="status">

        <span
            class="status-label"
            id="statusText">

            PLAYING

        </span>

        <span
            class="score"
            id="score">

            0

        </span>

    </div>


    <!-- 棋盘 -->

    <div class="board-wrap">

        <canvas
            id="gameCanvas"
            width="300"
            height="600">
        </canvas>

    </div>


    <!-- 操作 -->

    <div class="controls">

        <div class="control">
            <b>← →</b>
            MOVE
        </div>

        <div class="control">
            <b>↑</b>
            ROTATE
        </div>

        <div class="control">
            <b>↓</b>
            DOWN
        </div>

        <div class="control">
            <b>SPACE</b>
            DROP
        </div>

        <div class="control">
            <b>P</b>
            PAUSE
        </div>

    </div>

</div>


<div class="footer">

    ESC · Return to Game Library

</div>


</div>


<!-- =====================================================
                       游戏结束
===================================================== -->

<div
    class="overlay"
    id="gameOverOverlay">

    <div class="gameover-box">

        <div class="gameover-title">
            GAME OVER
        </div>

        <div class="gameover-score">

            SCORE

            <strong id="finalScore">
                0
            </strong>

        </div>

        <button
            class="restart"
            id="restart">

            PLAY AGAIN

        </button>

    </div>

</div>



<script>

/* =========================================================
                         基本参数
========================================================= */

const COLS = 10;

const ROWS = 20;

const CELL = 30;

const DROP_TIME = 500;


/* =========================================================
                         Canvas
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

ctx.imageSmoothingEnabled =
    false;


/* =========================================================
                         游戏状态
========================================================= */

let board;

let current;

let currentX;

let currentY;

let score = 0;

let gameOver = false;

let paused = false;

let lastDrop = 0;

let animationId = null;

let clearing = false;


/* =========================================================
                         方块
========================================================= */

const PIECES = [

    {
        shape:[
            [1,1,1,1]
        ],
        color:"#42d3ff"
    },

    {
        shape:[
            [1,1],
            [1,1]
        ],
        color:"#ffd84d"
    },

    {
        shape:[
            [0,1,0],
            [1,1,1]
        ],
        color:"#b86cff"
    },

    {
        shape:[
            [1,0,0],
            [1,1,1]
        ],
        color:"#5b7cff"
    },

    {
        shape:[
            [0,0,1],
            [1,1,1]
        ],
        color:"#ff9b4a"
    },

    {
        shape:[
            [0,1,1],
            [1,1,0]
        ],
        color:"#4edb82"
    },

    {
        shape:[
            [1,1,0],
            [0,1,1]
        ],
        color:"#ff5d73"
    }

];


/* =========================================================
                         消行音效
========================================================= */

const lineClearSound =
    new Audio("line-clear.mp3");

lineClearSound.volume =
    0.8;


/* =========================================================
                     播放消行音效
========================================================= */

function playLineClearSound(){

    lineClearSound.currentTime =
        0;

    lineClearSound
        .play()
        .catch(() => {});

}


/* =========================================================
                         初始化棋盘
========================================================= */

function createBoard(){

    return Array.from(
        {length:ROWS},
        () => Array(COLS).fill(null)
    );

}


/* =========================================================
                         随机方块
========================================================= */

function randomPiece(){

    const source =
        PIECES[
            Math.floor(
                Math.random() *
                PIECES.length
            )
        ];


    return {

        shape:
            source.shape.map(
                row => [...row]
            ),

        color:
            source.color

    };

}


/* =========================================================
                         新方块
========================================================= */

function spawnPiece(){

    current =
        randomPiece();


    currentX =
        Math.floor(
            (COLS -
            current.shape[0].length) / 2
        );


    currentY =
        0;


    if(
        collision(
            current.shape,
            currentX,
            currentY
        )
    ){

        endGame();

    }

}


/* =========================================================
                         碰撞
========================================================= */

function collision(
    shape,
    offsetX,
    offsetY
){

    for(
        let y=0;
        y<shape.length;
        y++
    ){

        for(
            let x=0;
            x<shape[y].length;
            x++
        ){

            if(!shape[y][x]){

                continue;

            }


            const bx =
                offsetX + x;

            const by =
                offsetY + y;


            if(
                bx < 0 ||
                bx >= COLS ||
                by >= ROWS
            ){

                return true;

            }


            if(
                by >= 0 &&
                board[by][bx]
            ){

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
                         旋转
========================================================= */

function rotateMatrix(matrix){

    const rows =
        matrix.length;

    const cols =
        matrix[0].length;


    const result =
        Array.from(
            {length:cols},
            () => Array(rows).fill(0)
        );


    for(
        let y=0;
        y<rows;
        y++
    ){

        for(
            let x=0;
            x<cols;
            x++
        ){

            result[x][rows-1-y] =
                matrix[y][x];

        }

    }


    return result;

}


/* =========================================================
                         旋转方块
========================================================= */

function rotate(){

    if(
        paused ||
        gameOver ||
        clearing
    ){

        return;

    }


    const rotated =
        rotateMatrix(
            current.shape
        );


    /*
     * 简单 Wall Kick
     */

    const tests = [

        [currentX,currentY],

        [currentX-1,currentY],

        [currentX+1,currentY],

        [currentX-2,currentY],

        [currentX+2,currentY]

    ];


    for(
        const [x,y]
        of tests
    ){

        if(
            !collision(
                rotated,
                x,
                y
            )
        ){

            current.shape =
                rotated;

            currentX =
                x;

            currentY =
                y;

            return;

        }

    }

}


/* =========================================================
                         固定方块
========================================================= */

function merge(){

    for(
        let y=0;
        y<current.shape.length;
        y++
    ){

        for(
            let x=0;
            x<current.shape[y].length;
            x++
        ){

            if(
                current.shape[y][x]
            ){

                const by =
                    currentY + y;

                const bx =
                    currentX + x;


                if(
                    by>=0 &&
                    by<ROWS &&
                    bx>=0 &&
                    bx<COLS
                ){

                    board[by][bx] =
                        current.color;

                }

            }

        }

    }

}


/* =========================================================
                         找满行
========================================================= */

function getFullRows(){

    const rows = [];


    for(
        let y=0;
        y<ROWS;
        y++
    ){

        if(
            board[y].every(
                cell =>
                    cell !== null
            )
        ){

            rows.push(y);

        }

    }


    return rows;

}


/* =========================================================
                     闪烁 + 消除
========================================================= */

async function clearLines(){

    const rows =
        getFullRows();


    if(rows.length === 0){

        return false;

    }


    clearing =
        true;


    /*
     * 闪烁两次
     */

    for(
        let flash=0;
        flash<2;
        flash++
    ){

        draw(
            true,
            rows
        );

        await sleep(100);


        draw(
            false,
            rows
        );

        await sleep(100);

    }


    /*
     * 消除瞬间播放音效
     */

    playLineClearSound();


    /*
     * 删除满行
     */

    const remaining =
        board.filter(
            (_,index) =>
                !rows.includes(index)
        );


    /*
     * 顶部补空行
     */

    while(
        remaining.length < ROWS
    ){

        remaining.unshift(
            Array(COLS).fill(null)
        );

    }


    board =
        remaining;


    /*
     * 每行 100 分
     */

    score +=
        100 * rows.length;


    updateScore();


    clearing =
        false;


    return true;

}


/* =========================================================
                         sleep
========================================================= */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
                         下落
========================================================= */

async function drop(){

    if(
        paused ||
        gameOver ||
        clearing
    ){

        return;

    }


    if(
        !collision(
            current.shape,
            currentX,
            currentY + 1
        )
    ){

        currentY++;

    }else{

        merge();


        await clearLines();


        if(!gameOver){

            spawnPiece();

        }

    }


    draw();

}


/* =========================================================
                         硬降
========================================================= */

async function hardDrop(){

    if(
        paused ||
        gameOver ||
        clearing
    ){

        return;

    }


    while(
        !collision(
            current.shape,
            currentX,
            currentY + 1
        )
    ){

        currentY++;

    }


    await drop();

}


/* =========================================================
                         移动
========================================================= */

function move(dx){

    if(
        paused ||
        gameOver ||
        clearing
    ){

        return;

    }


    if(
        !collision(
            current.shape,
            currentX + dx,
            currentY
        )
    ){

        currentX += dx;

        draw();

    }

}


/* =========================================================
                         绘制
========================================================= */

function draw(
    flashing=false,
    flashRows=[]
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * 背景
     */

    ctx.fillStyle =
        "#080d16";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * 网格
     */

    ctx.strokeStyle =
        "rgba(105,125,155,.16)";

    ctx.lineWidth =
        1;


    for(
        let x=0;
        x<=COLS;
        x++
    ){

        ctx.beginPath();

        ctx.moveTo(
            x*CELL + .5,
            0
        );

        ctx.lineTo(
            x*CELL + .5,
            ROWS*CELL
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<=ROWS;
        y++
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y*CELL + .5
        );

        ctx.lineTo(
            COLS*CELL,
            y*CELL + .5
        );

        ctx.stroke();

    }


    /*
     * 固定方块
     */

    for(
        let y=0;
        y<ROWS;
        y++
    ){

        for(
            let x=0;
            x<COLS;
            x++
        ){

            if(board[y][x]){

                const isFlash =
                    flashing &&
                    flashRows.includes(y);


                drawCell(
                    x,
                    y,
                    board[y][x],
                    isFlash
                );

            }

        }

    }


    /*
     * 当前方块
     */

    if(
        current &&
        !gameOver
    ){

        for(
            let y=0;
            y<current.shape.length;
            y++
        ){

            for(
                let x=0;
                x<current.shape[y].length;
                x++
            ){

                if(
                    current.shape[y][x]
                ){

                    drawCell(
                        currentX+x,
                        currentY+y,
                        current.color,
                        false
                    );

                }

            }

        }

    }

}


/* =========================================================
                       方块绘制
========================================================= */

function drawCell(
    x,
    y,
    color,
    flashing=false
){

    const px =
        x * CELL;

    const py =
        y * CELL;


    /*
     * 闪烁时变成白色
     */

    ctx.fillStyle =
        flashing
        ? "#ffffff"
        : color;


    ctx.fillRect(
        px+1,
        py+1,
        CELL-2,
        CELL-2
    );


    /*
     * 顶部高光
     */

    if(!flashing){

        ctx.fillStyle =
            "rgba(255,255,255,.22)";

        ctx.fillRect(
            px+2,
            py+2,
            CELL-4,
            3
        );


        ctx.fillStyle =
            "rgba(0,0,0,.16)";

        ctx.fillRect(
            px+2,
            py+CELL-5,
            CELL-4,
            3
        );

    }

}


/* =========================================================
                         分数
========================================================= */

function updateScore(){

    document
        .getElementById("score")
        .textContent =
        score;

}


/* =========================================================
                         暂停
========================================================= */

function togglePause(){

    if(
        gameOver ||
        clearing
    ){

        return;

    }


    paused =
        !paused;


    const status =
        document.getElementById(
            "statusText"
        );


    if(paused){

        status.textContent =
            "PAUSED";

        status.className =
            "status-label pause";

    }else{

        status.textContent =
            "PLAYING";

        status.className =
            "status-label";

        lastDrop =
            performance.now();

    }

}


/* =========================================================
                         游戏结束
========================================================= */

function endGame(){

    gameOver =
        true;


    paused =
        false;


    document
        .getElementById("statusText")
        .textContent =
        "GAME OVER";


    document
        .getElementById("statusText")
        .className =
        "status-label";


    document
        .getElementById("finalScore")
        .textContent =
        score;


    document
        .getElementById("gameOverOverlay")
        .classList
        .add("show");


    draw();

}


/* =========================================================
                         重新开始
========================================================= */

function restart(){

    board =
        createBoard();


    score =
        0;

    gameOver =
        false;

    paused =
        false;

    clearing =
        false;


    updateScore();


    document
        .getElementById("statusText")
        .textContent =
        "PLAYING";


    document
        .getElementById("statusText")
        .className =
        "status-label";


    document
        .getElementById("gameOverOverlay")
        .classList
        .remove("show");


    spawnPiece();


    lastDrop =
        performance.now();


    draw();

}


/* =========================================================
                         键盘
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.key === "p" ||
            e.key === "P"
        ){

            e.preventDefault();

            togglePause();

            return;

        }


        if(
            e.key === "Escape"
        ){

            window.location.href =
                "../../index.html";

            return;

        }


        if(
            gameOver ||
            paused ||
            clearing
        ){

            return;

        }


        switch(e.key){

            case "ArrowLeft":

                e.preventDefault();

                move(-1);

                break;


            case "ArrowRight":

                e.preventDefault();

                move(1);

                break;


            case "ArrowDown":

                e.preventDefault();

                drop();

                break;


            case "ArrowUp":

                e.preventDefault();

                rotate();

                draw();

                break;


            case " ":

                e.preventDefault();

                hardDrop();

                break;

        }

    }
);


/* =========================================================
                         点击
========================================================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        () => {

            restart();

        }
    );


/* =========================================================
                       游戏循环
========================================================= */

function gameLoop(timestamp){

    if(
        !gameOver &&
        !paused &&
        !clearing
    ){

        if(
            timestamp -
            lastDrop >=
            DROP_TIME
        ){

            drop();

            lastDrop =
                timestamp;

        }

    }


    animationId =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
                         启动
========================================================= */

restart();

animationId =
    requestAnimationFrame(
        gameLoop
    );

</script>
