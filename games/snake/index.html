<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>SNAKE</title>

<style>

/* =========================================================
                         基础变量
   ========================================================= */

:root{

    --bg:#07111f;

    --panel:#0d1a2b;

    --panel2:#122238;

    --line:#1c3048;

    --line-light:#29435f;

    --text:#eef5ff;

    --muted:#8295ad;

    --muted-light:#a8b8ca;

    --green:#55d66f;

    --green-dark:#329b4d;

    --green-light:#79ed8b;

    --red:#f05252;

    --red-dark:#b93636;

    --board:#091827;

    --grid:#14283d;
}


/* =========================================================
                         页面
   ========================================================= */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:var(--bg);

    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -15%,
            #18345f 0%,
            #0a1932 28%,
            #050d1c 65%,
            #020611 100%
        );

    display:flex;

    flex-direction:column;

    overflow-x:hidden;
}


/* =========================================================
                         顶部导航
   ========================================================= */

.header{

    position:relative;

    width:100%;
    height:64px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-bottom:
        1px solid var(--line);

    background:
        rgba(7,17,31,0.97);
}


.header-back{

    position:absolute;

    left:28px;

    top:50%;

    transform:
        translateY(-50%);

    color:var(--muted);

    font-size:13px;

    font-weight:500;

    text-decoration:none;

    letter-spacing:0.3px;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}


.header-back:hover{

    color:var(--text);

    transform:
        translateY(-50%)
        translateX(2px);

}


.header-title{

    margin:0;

    color:var(--text);

    font-size:20px;

    font-weight:700;

    letter-spacing:3px;

    line-height:1;
}


.header-brand{

    position:absolute;

    right:28px;

    top:50%;

    transform:
        translateY(-50%);

    color:var(--muted);

    font-size:13px;

    font-weight:500;

    letter-spacing:1px;
}


/* =========================================================
                         主区域
   ========================================================= */

.main{

    flex:1;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:
        16px
        16px
        20px;
}


/* =========================================================
                       游戏容器
   ========================================================= */

.game-card{

    width:min(520px,94vw);

    padding:16px;

    background:
        var(--panel);

    border:
        1px solid var(--line);

    border-radius:18px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.28);

}


/* =========================================================
                       游戏信息栏
   ========================================================= */

.game-info{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:16px;

    padding:
        0
        3px;
}


.score-box{

    display:flex;

    align-items:baseline;

    gap:8px;
}


.score-label{

    color:var(--muted);

    font-size:12px;

    letter-spacing:1px;

    text-transform:uppercase;
}


.score{

    color:var(--text);

    font-size:20px;

    font-weight:700;

    font-variant-numeric:tabular-nums;
}


.speed{

    color:var(--muted);

    font-size:12px;

    letter-spacing:0.5px;
}


/* =========================================================
                         棋盘
   ========================================================= */

.board-wrap{

    position:relative;

    width:100%;

    aspect-ratio:1 / 1;

    background:var(--board);

    border:
        1px solid var(--line-light);

    border-radius:10px;

    overflow:hidden;
}


#gameCanvas{

    display:block;

    width:100%;

    height:100%;

    background:var(--board);

    touch-action:none;
}


/* =========================================================
                       开始 / 结束遮罩
   ========================================================= */

.overlay{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:
        rgba(7,17,31,0.76);

    backdrop-filter:blur(3px);

    -webkit-backdrop-filter:blur(3px);

    transition:
        opacity 0.2s ease;
}


.overlay.hidden{

    opacity:0;

    pointer-events:none;
}


.overlay-title{

    margin:
        0 0 12px;

    font-size:34px;

    font-weight:800;

    letter-spacing:4px;

    color:var(--text);
}


.overlay-text{

    margin:0;

    color:var(--muted-light);

    font-size:14px;

    letter-spacing:0.3px;

    text-align:center;

    line-height:1.8;
}


/* =========================================================
                       底部操作提示
   ========================================================= */

.controls{

    margin-top:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    color:var(--muted);

    font-size:12px;

    flex-wrap:wrap;
}


.key{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-width:26px;

    height:24px;

    padding:
        0 7px;

    margin-right:4px;

    border:
        1px solid var(--line-light);

    border-bottom-width:2px;

    border-radius:5px;

    background:
        var(--panel2);

    color:#b8c8da;

    font-size:11px;

    font-family:inherit;
}


/* =========================================================
                  手机专用控制区域
                  
                  默认隐藏
                  因此电脑端完全不会出现
   ========================================================= */

.mobile-controls{

    display:none;

}


/* =========================================================
                         手机适配
   ========================================================= */

@media(max-width:600px){

    .header{

        height:64px;
    }


    .header-back{

        left:16px;

        font-size:11px;
    }


    .header-brand{

        right:16px;

        font-size:11px;
    }


    .header-title{

        font-size:17px;

        letter-spacing:2px;
    }


    .main{

        padding:
            22px
            10px
            30px;
    }


    .game-card{

        width:96vw;

        padding:14px;

        border-radius:14px;
    }


    .overlay-title{

        font-size:27px;

        letter-spacing:3px;
    }


    .controls{

        gap:9px;

        font-size:10px;
    }


    .key{

        height:22px;

        min-width:23px;

        padding:
            0 5px;
    }


    /* =====================================================
                       手机专用控制器
       ===================================================== */

    .mobile-controls{

        display:flex;

        flex-direction:column;

        align-items:center;

        margin-top:14px;

        width:100%;

        gap:7px;

        -webkit-user-select:none;

        user-select:none;

        touch-action:none;
    }


    .mobile-row{

        display:flex;

        justify-content:center;

        gap:7px;
    }


    .mobile-control-btn{

        width:54px;

        height:46px;

        display:flex;

        align-items:center;

        justify-content:center;

        border:
            1px solid var(--line-light);

        border-bottom-width:2px;

        border-radius:9px;

        background:
            var(--panel2);

        color:#dbe8f7;

        font-size:20px;

        font-weight:700;

        line-height:1;

        box-shadow:
            0 4px 10px
            rgba(0,0,0,.18);

        -webkit-user-select:none;

        user-select:none;

        -webkit-tap-highlight-color:transparent;

        touch-action:none;

        transition:
            background .08s,
            transform .08s,
            border-color .08s;
    }


    .mobile-control-btn:active{

        background:#1b3049;

        border-color:#3a5878;

        transform:translateY(1px);
    }


    .mobile-start{

        width:115px;

        height:40px;

        margin-top:3px;

        border:
            1px solid #315cff;

        border-radius:8px;

        background:#315cff;

        color:#fff;

        font-size:12px;

        font-weight:800;

        letter-spacing:.5px;

        box-shadow:
            0 5px 15px
            rgba(49,92,255,.18);

        touch-action:none;

        -webkit-tap-highlight-color:transparent;
    }


    .mobile-start:active{

        background:#4770ff;

        transform:translateY(1px);
    }


    /*
     * 手机端不再显示电脑键盘操作说明。
     */

    .controls{

        display:none;
    }

}


/* =========================================================
                  很小屏幕手机
   ========================================================= */

@media(max-width:380px){

    .mobile-control-btn{

        width:50px;

        height:43px;

        font-size:18px;
    }


    .mobile-controls{

        margin-top:11px;

        gap:5px;
    }


    .mobile-row{

        gap:5px;
    }


    .mobile-start{

        height:38px;

        width:108px;
    }

}

</style>
</head>


<body>


<!-- =========================================================
                         顶部导航
     ========================================================= -->

<header class="header">


    <a
        class="header-back"
        href="../../index.html"
    >
        ← Game Library
    </a>


    <h1 class="header-title">
        SNAKE
    </h1>


    <div class="header-brand">
        CHENZI
    </div>


</header>


<!-- =========================================================
                         游戏主体
     ========================================================= -->

<main class="main">


    <section class="game-card">


        <!-- =================================================
                         信息栏
             ================================================= -->

        <div class="game-info">


            <div class="score-box">

                <span class="score-label">
                    Score
                </span>

                <span
                    class="score"
                    id="score"
                >
                    0
                </span>

            </div>


            <div
                class="speed"
                id="speed"
            >
                SPEED 1
            </div>


        </div>


        <!-- =================================================
                         游戏棋盘
             ================================================= -->

        <div class="board-wrap">


            <canvas
                id="gameCanvas"
                width="600"
                height="600"
            ></canvas>


            <!-- =================================================
                             游戏提示
                 ================================================= -->

            <div
                class="overlay"
                id="overlay"
            >


                <h2
                    class="overlay-title"
                    id="overlayTitle"
                >
                    SNAKE
                </h2>


                <p
                    class="overlay-text"
                    id="overlayText"
                >
                    按 SPACE 开始
                </p>


            </div>


        </div>


        <!-- =================================================
                     手机专用控制区域
                     
                     电脑端不会显示
             ================================================= -->

        <div
            class="mobile-controls"
            id="mobileControls"
        >


            <div class="mobile-row">

                <button
                    class="mobile-control-btn"
                    data-direction="up"
                    aria-label="向上"
                >
                    ↑
                </button>

            </div>


            <div class="mobile-row">

                <button
                    class="mobile-control-btn"
                    data-direction="left"
                    aria-label="向左"
                >
                    ←
                </button>


                <button
                    class="mobile-control-btn"
                    data-direction="down"
                    aria-label="向下"
                >
                    ↓
                </button>


                <button
                    class="mobile-control-btn"
                    data-direction="right"
                    aria-label="向右"
                >
                    →
                </button>

            </div>


            <button
                class="mobile-start"
                id="mobileStartBtn"
            >
                START
            </button>


        </div>


        <!-- =================================================
                         操作说明
             ================================================= -->

        <div class="controls">


            <span>

                <span class="key">↑</span>

                <span class="key">↓</span>

                <span class="key">←</span>

                <span class="key">→</span>

                移动

            </span>


            <span>

                <span class="key">SPACE</span>

                开始 / 重开

            </span>


            <span>

                <span class="key">ESC</span>

                返回

            </span>


        </div>


    </section>


</main>


<!-- =========================================================
                         背景音乐
     ========================================================= -->

<audio
    id="bgm"
    src="snakegame_bgm.mp3"
    loop
    preload="auto"
></audio>


<script>

/* =========================================================
                         DOM
   ========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const scoreElement =
    document.getElementById(
        "score"
    );


const speedElement =
    document.getElementById(
        "speed"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const overlayTitle =
    document.getElementById(
        "overlayTitle"
    );


const overlayText =
    document.getElementById(
        "overlayText"
    );


const bgm =
    document.getElementById(
        "bgm"
    );


const mobileStartBtn =
    document.getElementById(
        "mobileStartBtn"
    );


const mobileControlButtons =
    document.querySelectorAll(
        ".mobile-control-btn"
    );


/* =========================================================
                     设备判断
                     
                     只用于新增手机功能。
                     
                     电脑端原逻辑不改变。
   ========================================================= */

function isMobileDevice(){

    return window.matchMedia(
        "(max-width:600px)"
    ).matches;

}


/* =========================================================
                         游戏参数
   ========================================================= */

const BOARD_SIZE = 20;

const INITIAL_LENGTH = 4;

const INITIAL_DELAY = 150;

const MIN_DELAY = 80;

const SPEED_UP = 3;


/* =========================================================
                         游戏状态
   ========================================================= */

let snake = [];

let food = null;


let direction = {

    x:1,

    y:0

};


let nextDirection = {

    x:1,

    y:0

};


let score = 0;

let moveDelay =
    INITIAL_DELAY;


let started = false;

let gameOver = false;


let lastMove = 0;


let directionChanged = false;


/* =========================================================
                         音频系统
   ========================================================= */

let audioContext = null;


function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


/* =========================================================
                     吃豆 BO 音效
   ========================================================= */

function playBo(){

    initAudio();


    const now =
        audioContext.currentTime;


    const oscillator =
        audioContext.createOscillator();


    const oscillator2 =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    const gain2 =
        audioContext.createGain();


    const compressor =
        audioContext.createDynamicsCompressor();


    compressor.threshold.value = -18;

    compressor.knee.value = 8;

    compressor.ratio.value = 8;

    compressor.attack.value = 0.003;

    compressor.release.value = 0.08;


    oscillator.type =
        "square";


    oscillator.frequency.setValueAtTime(
        240,
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        105,
        now + 0.13
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.34,
        now + 0.006
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.14
    );


    oscillator2.type =
        "triangle";


    oscillator2.frequency.setValueAtTime(
        480,
        now
    );


    oscillator2.frequency.exponentialRampToValueAtTime(
        210,
        now + 0.11
    );


    gain2.gain.setValueAtTime(
        0.0001,
        now
    );


    gain2.gain.exponentialRampToValueAtTime(
        0.13,
        now + 0.005
    );


    gain2.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.11
    );


    oscillator.connect(gain);

    oscillator2.connect(gain2);

    gain.connect(compressor);

    gain2.connect(compressor);

    compressor.connect(
        audioContext.destination
    );


    oscillator.start(now);

    oscillator2.start(now);


    oscillator.stop(
        now + 0.15
    );

    oscillator2.stop(
        now + 0.12
    );

}


/* =========================================================
                     背景音乐
   ========================================================= */

function startMusic(){

    bgm.volume = 0.22;


    const promise =
        bgm.play();


    if(
        promise !== undefined
    ){

        promise.catch(
            () => {}
        );

    }

}


function stopMusic(){

    bgm.pause();

    bgm.currentTime = 0;

}


/* =========================================================
                       单格大小
   ========================================================= */

function cellSize(){

    return (
        canvas.width /
        BOARD_SIZE
    );

}


/* =========================================================
                       绘制棋盘
   ========================================================= */

function drawBoard(){

    const size =
        cellSize();


    ctx.fillStyle =
        "#091827";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.strokeStyle =
        "#14283d";


    ctx.lineWidth = 1;


    for(
        let x = 1;
        x < BOARD_SIZE;
        x++
    ){

        ctx.beginPath();


        ctx.moveTo(
            x * size,
            0
        );


        ctx.lineTo(
            x * size,
            canvas.height
        );


        ctx.stroke();

    }


    for(
        let y = 1;
        y < BOARD_SIZE;
        y++
    ){

        ctx.beginPath();


        ctx.moveTo(
            0,
            y * size
        );


        ctx.lineTo(
            canvas.width,
            y * size
        );


        ctx.stroke();

    }

}


/* =========================================================
                       绘制蛇
   ========================================================= */

function drawSnake(){

    const size =
        cellSize();


    for(
        let i =
            snake.length - 1;

        i >= 0;

        i--
    ){

        const segment =
            snake[i];


        const padding =
            i === 0
                ? size * 0.10
                : size * 0.14;


        const x =
            segment.x * size +
            padding;


        const y =
            segment.y * size +
            padding;


        const width =
            size -
            padding * 2;


        const radius =
            Math.min(
                5,
                width * 0.18
            );


        if(i === 0){

            ctx.fillStyle =
                "#79ed8b";


            ctx.strokeStyle =
                "#3caf58";

        }

        else{

            ctx.fillStyle =
                "#55d66f";


            ctx.strokeStyle =
                "#329b4d";

        }


        roundRect(
            ctx,
            x,
            y,
            width,
            width,
            radius
        );


        ctx.fill();

        ctx.stroke();

    }

}


/* =========================================================
                       圆角矩形
   ========================================================= */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
){

    context.beginPath();


    context.moveTo(
        x + radius,
        y
    );


    context.lineTo(
        x + width - radius,
        y
    );


    context.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    context.lineTo(
        x + width,
        y + height - radius
    );


    context.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    context.lineTo(
        x + radius,
        y + height
    );


    context.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    context.lineTo(
        x,
        y + radius
    );


    context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    context.closePath();

}


/* =========================================================
                       绘制食物
   ========================================================= */

function drawFood(){

    const size =
        cellSize();


    const centerX =
        food.x * size +
        size / 2;


    const centerY =
        food.y * size +
        size / 2;


    const radius =
        size * 0.28;


    ctx.beginPath();


    ctx.arc(
        centerX,
        centerY,
        radius + 3,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(240,82,82,0.12)";


    ctx.fill();


    ctx.beginPath();


    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#f05252";


    ctx.fill();


    ctx.strokeStyle =
        "#b93636";


    ctx.lineWidth =
        1.5;


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
        centerX - radius * 0.32,
        centerY - radius * 0.32,
        radius * 0.22,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(255,255,255,0.45)";


    ctx.fill();

}


/* =========================================================
                       绘制全部
   ========================================================= */

function draw(){

    drawBoard();

    drawFood();

    drawSnake();

}


/* =========================================================
                     生成食物
   ========================================================= */

function createFood(){

    while(true){

        const position = {

            x:
                Math.floor(
                    Math.random() *
                    (BOARD_SIZE - 4)
                ) + 2,


            y:
                Math.floor(
                    Math.random() *
                    (BOARD_SIZE - 4)
                ) + 2

        };


        const occupied =
            snake.some(
                segment =>

                    segment.x ===
                    position.x &&

                    segment.y ===
                    position.y
            );


        if(!occupied){

            return position;

        }

    }

}


/* =========================================================
                       初始化
   ========================================================= */

function initializeGame(){

    snake = [];


    for(
        let i = 0;
        i < INITIAL_LENGTH;
        i++
    ){

        snake.push({

            x:10 - i,

            y:10

        });

    }


    direction = {

        x:1,

        y:0

    };


    nextDirection = {

        x:1,

        y:0

    };


    score = 0;


    moveDelay =
        INITIAL_DELAY;


    started = false;


    gameOver = false;


    lastMove = 0;


    directionChanged =
        false;


    scoreElement.textContent =
        "0";


    updateSpeedText();


    food =
        createFood();


    overlayTitle.textContent =
        "SNAKE";


    overlayText.innerHTML =
        isMobileDevice()
            ? "点击 START 开始<br>或直接点击游戏区域"
            : "按 SPACE 开始";


    overlay.classList.remove(
        "hidden"
    );


    /*
     * 手机按钮状态
     */

    if(isMobileDevice()){

        mobileStartBtn.textContent =
            "START";

    }


    draw();

}


/* =========================================================
                     更新速度显示
   ========================================================= */

function updateSpeedText(){

    const speedLevel =
        Math.floor(
            (
                INITIAL_DELAY -
                moveDelay
            ) / 10
        ) + 1;


    speedElement.textContent =
        `SPEED ${speedLevel}`;

}


/* =========================================================
                       开始游戏
   ========================================================= */

function startGame(){

    initAudio();


    started = true;

    gameOver = false;


    startMusic();


    overlay.classList.add(
        "hidden"
    );


    if(isMobileDevice()){

        mobileStartBtn.textContent =
            "RESTART";

    }


    lastMove =
        performance.now();

}


/* =========================================================
                       游戏结束
   ========================================================= */

function endGame(){

    gameOver = true;


    stopMusic();


    overlayTitle.textContent =
        "GAME OVER";


    overlayText.innerHTML =
        isMobileDevice()
            ? `Score: ${score}<br>点击 START 重新开始`
            : `Score: ${score}<br>
               SPACE 重新开始`;


    overlay.classList.remove(
        "hidden"
    );


    if(isMobileDevice()){

        mobileStartBtn.textContent =
            "RESTART";

    }


    draw();

}


/* =========================================================
                       重新开始
   ========================================================= */

function restartGame(){

    initializeGame();


    started = true;

    gameOver = false;


    startMusic();


    overlay.classList.add(
        "hidden"
    );


    if(isMobileDevice()){

        mobileStartBtn.textContent =
            "RESTART";

    }


    lastMove =
        performance.now();

}


/* =========================================================
                       吃豆
   ========================================================= */

function eatFood(){

    score++;


    scoreElement.textContent =
        score;


    moveDelay =
        Math.max(
            MIN_DELAY,
            INITIAL_DELAY -
            score * SPEED_UP
        );


    updateSpeedText();


    playBo();


    food =
        createFood();

}


/* =========================================================
                       更新蛇
   ========================================================= */

function update(){

    direction = {

        x:
            nextDirection.x,

        y:
            nextDirection.y

    };


    const newHead = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* =====================================================
                         撞墙
       ===================================================== */

    if(

        newHead.x < 0 ||

        newHead.x >= BOARD_SIZE ||

        newHead.y < 0 ||

        newHead.y >= BOARD_SIZE

    ){

        endGame();

        return;

    }


    const willEat =

        newHead.x === food.x &&

        newHead.y === food.y;


    /* =====================================================
                         撞自己
       ===================================================== */

    const bodyToCheck =

        willEat

            ? snake

            : snake.slice(
                0,
                snake.length - 1
            );


    const hitSelf =

        bodyToCheck.some(
            segment =>

                segment.x ===
                newHead.x &&

                segment.y ===
                newHead.y
        );


    if(hitSelf){

        endGame();

        return;

    }


    /* =====================================================
                         蛇向前
       ===================================================== */

    snake.unshift(
        newHead
    );


    if(willEat){

        eatFood();

    }

    else{

        snake.pop();

    }


    directionChanged =
        false;


    draw();

}


/* =========================================================
                       主循环
   ========================================================= */

function gameLoop(
    timestamp
){

    if(

        started &&

        !gameOver

    ){

        if(

            timestamp -
            lastMove >=
            moveDelay

        ){

            lastMove =
                timestamp;


            update();

        }

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
                       键盘
                       
                       电脑端原逻辑保留
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        const key =
            event.key.toLowerCase();


        if(

            key === " " ||

            key === "spacebar"

        ){

            event.preventDefault();


            initAudio();


            if(!started){

                startGame();

                return;

            }


            if(gameOver){

                restartGame();

                return;

            }


            return;

        }


        if(key === "escape"){

            event.preventDefault();


            window.history.back();


            return;

        }


        if(

            !started ||

            gameOver

        ){

            return;

        }


        if(directionChanged){

            return;

        }


        if(

            key === "arrowup" ||

            key === "w"

        ){

            if(direction.y !== 1){

                nextDirection = {

                    x:0,

                    y:-1

                };


                directionChanged =
                    true;

            }

        }


        else if(

            key === "arrowdown" ||

            key === "s"

        ){

            if(direction.y !== -1){

                nextDirection = {

                    x:0,

                    y:1

                };


                directionChanged =
                    true;

            }

        }


        else if(

            key === "arrowleft" ||

            key === "a"

        ){

            if(direction.x !== 1){

                nextDirection = {

                    x:-1,

                    y:0

                };


                directionChanged =
                    true;

            }

        }


        else if(

            key === "arrowright" ||

            key === "d"

        ){

            if(direction.x !== -1){

                nextDirection = {

                    x:1,

                    y:0

                };


                directionChanged =
                    true;

            }

        }

    }
);


/* =========================================================
                手机方向控制
                 
                只在手机端启用
   ========================================================= */

function setMobileDirection(
    dir
){

    /*
     * 防止电脑端受到任何影响。
     */

    if(!isMobileDevice()){

        return;

    }


    /*
     * 手机还没有开始：
     * 点击方向键也直接开始游戏。
     *
     * 这样用户不一定非要先找 START。
     */

    if(!started){

        startGame();

    }


    /*
     * 游戏结束：
     * 第一次点击方向键直接重新开始。
     */

    if(gameOver){

        restartGame();

    }


    /*
     * 当前周期已经改变过方向，
     * 与电脑键盘保持完全相同的规则。
     */

    if(directionChanged){

        return;

    }


    if(dir === "up"){

        if(direction.y !== 1){

            nextDirection = {

                x:0,

                y:-1

            };


            directionChanged =
                true;

        }

    }


    else if(dir === "down"){

        if(direction.y !== -1){

            nextDirection = {

                x:0,

                y:1

            };


            directionChanged =
                true;

        }

    }


    else if(dir === "left"){

        if(direction.x !== 1){

            nextDirection = {

                x:-1,

                y:0

            };


            directionChanged =
                true;

        }

    }


    else if(dir === "right"){

        if(direction.x !== -1){

            nextDirection = {

                x:1,

                y:0

            };


            directionChanged =
                true;

        }

    }

}


/* =========================================================
                  手机按钮事件
   ========================================================= */

mobileControlButtons.forEach(
    button=>{

        /*
         * pointerdown 比 click 更适合手机。
         */

        button.addEventListener(
            "pointerdown",
            function(event){

                if(
                    !isMobileDevice()
                ){

                    return;

                }


                event.preventDefault();

                event.stopPropagation();


                const directionName =
                    button.dataset.direction;


                setMobileDirection(
                    directionName
                );


                /*
                 * 轻微震动反馈。
                 */

                if(
                    navigator.vibrate
                ){

                    navigator.vibrate(12);

                }

            },
            {
                passive:false
            }
        );

    }
);


/* =========================================================
                    手机 START / RESTART
   ========================================================= */

mobileStartBtn.addEventListener(
    "pointerdown",
    function(event){

        if(
            !isMobileDevice()
        ){

            return;

        }


        event.preventDefault();

        event.stopPropagation();


        initAudio();


        if(
            !started
        ){

            startGame();

        }

        else if(
            gameOver
        ){

            restartGame();

        }

        else{

            restartGame();

        }


        if(
            navigator.vibrate
        ){

            navigator.vibrate(18);

        }

    },
    {
        passive:false
    }
);


/* =========================================================
              手机直接点击游戏区域开始
   ========================================================= */

overlay.addEventListener(
    "pointerdown",
    function(event){

        if(
            !isMobileDevice()
        ){

            return;

        }


        /*
         * 只处理触摸。
         */

        if(
            event.pointerType !== "touch"
        ){

            return;

        }


        event.preventDefault();


        /*
         * 游戏结束 → 重新开始
         */

        if(gameOver){

            restartGame();

            return;

        }


        /*
         * 尚未开始 → 开始
         */

        if(!started){

            startGame();

        }

    },
    {
        passive:false
    }
);


/* =========================================================
                 手机滑动控制
                 
                 在棋盘上滑动即可改变方向
   ========================================================= */

let touchStartX = 0;

let touchStartY = 0;

let touchTracking = false;


canvas.addEventListener(
    "pointerdown",
    function(event){

        if(
            !isMobileDevice()
        ){

            return;

        }


        if(
            event.pointerType !== "touch"
        ){

            return;

        }


        event.preventDefault();


        touchStartX =
            event.clientX;

        touchStartY =
            event.clientY;

        touchTracking =
            true;

    },
    {
        passive:false
    }
);


canvas.addEventListener(
    "pointerup",
    function(event){

        if(
            !isMobileDevice()
        ){

            return;

        }


        if(
            event.pointerType !== "touch"
        ){

            return;

        }


        event.preventDefault();


        if(!touchTracking){

            return;

        }


        touchTracking =
            false;


        const dx =
            event.clientX -
            touchStartX;


        const dy =
            event.clientY -
            touchStartY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
         * 手指移动距离太小，
         * 不认为是滑动。
         */

        if(distance < 20){

            return;

        }


        /*
         * 横向滑动
         */

        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            if(dx > 0){

                setMobileDirection(
                    "right"
                );

            }

            else{

                setMobileDirection(
                    "left"
                );

            }

        }

        /*
         * 纵向滑动
         */

        else{

            if(dy > 0){

                setMobileDirection(
                    "down"
                );

            }

            else{

                setMobileDirection(
                    "up"
                );

            }

        }

    },
    {
        passive:false
    }
);


canvas.addEventListener(
    "pointercancel",
    function(event){

        if(
            event.pointerType ===
            "touch"
        ){

            touchTracking =
                false;

        }

    }
);


/* =========================================================
                    页面切换
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(

            document.hidden &&

            started &&

            !gameOver

        ){

            bgm.pause();

        }


        else if(

            !document.hidden &&

            started &&

            !gameOver

        ){

            startMusic();


            lastMove =
                performance.now();

        }

    }
);


/* =========================================================
                       启动
   ========================================================= */

initializeGame();


requestAnimationFrame(
    gameLoop
);

</script>
